[package]
name = "pulsewatch-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "PulseWatch desktop agent — ships local Claude Code / Codex usage counters to the backend"

[lib]
name = "pulsewatch_agent_lib"
path = "src/lib.rs"

[[bin]]
name = "pulsewatch-agent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
pulsewatch-agent-core = { path = "../agent-core" }

tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"

base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dirs = "5"

[features]
custom-protocol = ["tauri/custom-protocol"]
