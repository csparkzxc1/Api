[package]
name = "pulsewatch-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "PulseWatch desktop agent — ships local Claude Code / Codex usage counters to the backend"

[lib]
name = "pulsewatch_agent_lib"
path = "src/lib.rs"

[[bin]]
name = "pulsewatch-agent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"

# Crypto / HTTP
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "io-util"] }
futures = "0.3"

# Filesystem watching
notify = "6"
notify-debouncer-full = "0.3"

# Keyring (token at rest)
keyring = "3"

# Time + dirs
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
glob = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
