[package]
name = "pulsewatch-agent-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pure-Rust core for the PulseWatch desktop agent — parsers, watcher, uploader, vault. No Tauri."

[dev-dependencies]
tempfile = "3"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
walkdir = "2"
keyring = "3"
notify = "6"
notify-debouncer-full = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "io-util"] }
tracing = "0.1"
url = "2"
