workflows:
  ios-testflight:
    name: Cap iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: cap-asc-admin-key

    environment:
      vars:
        BUNDLE_ID_IOS: "app.cap.Cap"
        BUNDLE_ID_WATCH: "app.cap.Cap.watchkitapp"
        BUNDLE_ID_COMPLICATIONS: "app.cap.Cap.watchkitapp.complications"
        XCODE_PROJECT: "ios/Cap.xcodeproj"
        XCODE_SCHEME: "Cap"
        APP_STORE_APPLE_ID: 6768013237
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate

      - name: Initialize keychain
        script: keychain initialize

      - name: Generate distribution certificate private key
        script: |
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cap_dist.key -q -N ""

      - name: Fetch signing files for all 3 targets
        script: |
          for ID in "$BUNDLE_ID_IOS" "$BUNDLE_ID_WATCH" "$BUNDLE_ID_COMPLICATIONS"; do
            echo "=== Fetching profile for $ID ==="
            app-store-connect fetch-signing-files "$ID" \
              --type IOS_APP_STORE \
              --create \
              --certificate-key=@file:/tmp/cap_dist.key
          done

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply signing on Xcode project
        script: xcode-project use-profiles

      - name: Increment build number
        script: |
          cd ios
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $((LATEST_BUILD + 1))

      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
