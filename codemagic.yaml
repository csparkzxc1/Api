workflows:
  ios-testflight:
    name: Cap iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: cap-asc-admin-key

    environment:
      vars:
        BUNDLE_ID: "app.cap.Cap"
        XCODE_PROJECT: "ios/Cap.xcodeproj"
        XCODE_SCHEME: "Cap"
        APP_STORE_APPLE_ID: 6768013237
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate

      - name: Initialize keychain
        script: keychain initialize

      - name: Fetch signing files (auto-creates if missing)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychaiworkflows:
  ios-testflight:
    namely signing on Xcode project
        script: xcode-project use-profiles

      - name: Increment build number
        script: |
          cd ios
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $((LATEST_BUILD + 1))

      - name      xcode: latest

    trigger        xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
