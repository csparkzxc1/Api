name: Cap
options:
  bundleIdPrefix: app.cap
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    WATCHOS_DEPLOYMENT_TARGET: '10.0'
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
    SWIFT_TREAT_WARNINGS_AS_ERRORS: 'NO'

packages:
  CapKit:
    path: CapKit

targets:
  Cap:
    type: application
    platform: iOS
    sources:
      - path: Cap
    resources:
      - path: Cap/Resources/Assets.xcassets
      - path: ../assets/fonts
        type: folder
    info:
      path: Cap/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cap
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - JetBrainsMono-Light.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
          - Geist-Light.ttf
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cap.Cap
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_EMIT_LOC_STRINGS: 'YES'
        GENERATE_INFOPLIST_FILE: 'NO'
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: CapKit
        product: CapKit
      - target: CapWatch
        embed: true

  CapWatch:
    type: application
    platform: watchOS
    sources:
      - path: CapWatch
    resources:
      - path: CapWatch/Resources/Assets.xcassets
      - path: ../assets/fonts
        type: folder
    info:
      path: CapWatch/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cap.Cap.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        WATCHOS_DEPLOYMENT_TARGET: '10.0'
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: 'NO'
        SDKROOT: watchos
        WK_APPLICATION_NAME: Cap
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.cap.Cap
        GENERATE_INFOPLIST_FILE: 'NO'
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: CapKit
        product: CapKit
      - target: CapComplications
        embed: true

  CapComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: CapComplications
    info:
      path: CapComplications/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cap.Cap.watchkitapp.complications
        TARGETED_DEVICE_FAMILY: '4'
        WATCHOS_DEPLOYMENT_TARGET: '10.0'
        SDKROOT: watchos
        GENERATE_INFOPLIST_FILE: 'NO'
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: CapKit
        product: CapKit
