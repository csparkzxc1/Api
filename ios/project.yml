name: PulseWatch
options:
  bundleIdPrefix: app.pulsewatch
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
    SWIFT_TREAT_WARNINGS_AS_ERRORS: 'NO'

packages:
  PulseWatchKit:
    path: PulseWatchKit

targets:
  PulseWatch:
    type: application
    platform: iOS
    sources:
      - path: PulseWatch
    resources:
      - path: PulseWatch/Resources/Assets.xcassets
    info:
      path: PulseWatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: PulseWatch
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pulsewatch.PulseWatch
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_EMIT_LOC_STRINGS: 'YES'
        GENERATE_INFOPLIST_FILE: 'NO'
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: PulseWatchKit
        product: PulseWatchKit
