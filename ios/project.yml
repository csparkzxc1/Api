name: PulseWatch
options:
  bundleIdPrefix: app.pulsewatch
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    WATCHOS_DEPLOYMENT_TARGET: '10.0'
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
    SWIFT_TREAT_WARNINGS_AS_ERRORS: 'NO'

packages:
  PulseWatchKit:
    path: PulseWatchKit

targets:
  PulseWatch:
    type: application
    platform: iOS
    sources:
      - path: PulseWatch
    resources:
      - path: PulseWatch/Resources/Assets.xcassets
      - path: ../assets/fonts
        type: folder
    info:
      path: PulseWatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: PulseWatch
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - JetBrainsMono-Light.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
          - Geist-Light.ttf
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pulsewatch.PulseWatch
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_EMIT_LOC_STRINGS: 'YES'
        GENERATE_INFOPLIST_FILE: 'NO'
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: PulseWatchKit
        product: PulseWatchKit
      - target: PulseWatchWatch
        embed: true

  PulseWatchWatch:
    type: application
    platform: watchOS
    sources:
      - path: PulseWatchWatch
    resources:
      - path: PulseWatchWatch/Resources/Assets.xcassets
      - path: ../assets/fonts
        type: folder
    info:
      path: PulseWatchWatch/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pulsewatch.PulseWatch.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        WATCHOS_DEPLOYMENT_TARGET: '10.0'
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: 'NO'
        SDKROOT: watchos
        WK_APPLICATION_NAME: PulseWatch
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.pulsewatch.PulseWatch
        GENERATE_INFOPLIST_FILE: 'NO'
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: PulseWatchKit
        product: PulseWatchKit
      - target: PulseWatchComplications
        embed: true

  PulseWatchComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: PulseWatchComplications
    info:
      path: PulseWatchComplications/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pulsewatch.PulseWatch.watchkitapp.complications
        TARGETED_DEVICE_FAMILY: '4'
        WATCHOS_DEPLOYMENT_TARGET: '10.0'
        SDKROOT: watchos
        GENERATE_INFOPLIST_FILE: 'NO'
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: PulseWatchKit
        product: PulseWatchKit
