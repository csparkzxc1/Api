app = "cap-api"
primary_region = "iad"

[build]
  dockerfile = "../Dockerfile"
  build-target = "runtime"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  POLL_INTERVAL_SECONDS = "600"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [[http_service.checks.http]]
      interval = "30s"
      timeout = "5s"
      grace_period = "10s"
      method = "GET"
      path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[processes]
  app = "node dist/server.js"
  worker = "node dist/workers/run.js"
