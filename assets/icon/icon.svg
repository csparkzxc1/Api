<?xml version="1.0" encoding="UTF-8"?>
<!--
  Throttle app icon — master.

  The icon is a stylised slider/throttle: the orange-filled portion of the
  track is the "used" share; the white knob with a Claude-orange dot marks
  the current position. Everything else (font sizes, glow alphas, scale)
  is derived from the same numbers so render.sh can produce every size
  without re-tuning.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%"  stop-color="#1a1a1a"/>
      <stop offset="60%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="knobShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="knobLight" cx="40%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#f6f6f6"/>
      <stop offset="100%" stop-color="#e5e5e5"/>
    </radialGradient>
  </defs>

  <!-- Background plate with subtle radial vignette -->
  <rect width="1024" height="1024" fill="url(#vignette)"/>

  <!--
    Track geometry
    The track sits horizontally at the canvas centre, ~48% of the canvas
    wide. The fill stops at 70% so the icon reads as "in use, near limit"
    at a glance.
  -->
  <g>
    <!-- Track-right (unfilled) -->
    <rect x="262" y="492" width="500" height="40" rx="20" ry="20" fill="#3a1f14"/>
    <!-- Track-left (filled, claude) — width = 70% of 500 = 350 -->
    <rect x="262" y="492" width="350" height="40" rx="20" ry="20" fill="#D97757"/>
  </g>

  <!--
    Knob — sits on the boundary at x=262+350=612 (the 70% mark).
    Drop shadow gives it weight on the dark plate.
  -->
  <g>
    <ellipse cx="612" cy="540" rx="72" ry="22" fill="url(#knobShadow)" opacity="0.55"/>
    <circle cx="612" cy="512" r="78" fill="url(#knobLight)"/>
    <circle cx="612" cy="512" r="32" fill="#D97757"/>
  </g>
</svg>
